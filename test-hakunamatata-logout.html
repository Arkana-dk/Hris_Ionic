<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Login & Logout API - hakunamatata.my.id</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }
      h1 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 28px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .section {
        margin-bottom: 30px;
        padding: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 15px;
      }
      .section h2 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 18px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      button.logout-btn {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }
      button.logout-btn:hover {
        box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
      }
      #result,
      #logoutResult {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
      }
      .success {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
      .info {
        background: #d1ecf1;
        border: 1px solid #bee5eb;
        color: #0c5460;
      }
      pre {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        margin-top: 10px;
        font-size: 12px;
      }
      .note {
        background: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
        padding: 15px;
        border-radius: 10px;
        margin-top: 20px;
        font-size: 13px;
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: inline-block;
        margin-right: 10px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .token-info {
        background: #e3f2fd;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
        font-size: 13px;
      }
      .token-info strong {
        color: #1976d2;
      }
      #logoutSection {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Test Login & Logout API</h1>
      <p class="subtitle">hakunamatata.my.id</p>

      <div class="note">
        <strong>📝 Catatan:</strong><br />
        Test ini akan mencoba login dan logout ke API hakunamatata.my.id.<br />
        • Login membutuhkan: <code>_token</code>, <code>email</code>,
        <code>password</code><br />
        • Logout hanya membutuhkan: <code>_token</code>
      </div>

      <!-- LOGIN SECTION -->
      <div class="section" id="loginSection">
        <h2>🔓 Login Test</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">📧 Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="bagas@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">🔒 Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              required
            />
          </div>

          <button type="submit" id="loginBtn">Login</button>
        </form>

        <div id="result"></div>
      </div>

      <!-- LOGOUT SECTION (Hidden until logged in) -->
      <div class="section" id="logoutSection">
        <h2>🚪 Logout Test</h2>

        <div class="token-info" id="tokenInfo">
          <strong>🎫 Current Session:</strong><br />
          <span id="currentToken">No token</span>
        </div>

        <button type="button" id="logoutBtn" class="logout-btn">Logout</button>

        <div id="logoutResult"></div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://hakunamatata.my.id";
      const API_URL = "https://hakunamatata.my.id/api";

      let _token = null;
      let authToken = null;

      // Get _token from server
      async function getToken() {
        try {
          console.log("🔑 Fetching _token from server...");

          const response = await fetch(`${API_BASE_URL}/login`, {
            method: "GET",
            credentials: "include",
            headers: {
              Accept: "text/html,application/json",
            },
          });

          if (response.ok) {
            const text = await response.text();

            // Try to extract _token from HTML
            const tokenMatch =
              text.match(/name=["']_token["'].*?value=["']([^"']+)["']/) ||
              text.match(/value=["']([^"']+)["'].*?name=["']_token["']/);

            if (tokenMatch && tokenMatch[1]) {
              _token = tokenMatch[1];
              console.log(
                "✅ _token fetched:",
                _token.substring(0, 20) + "..."
              );
              return _token;
            }

            // Fallback: check XSRF-TOKEN cookie
            const cookies = document.cookie.split(";");
            for (const cookie of cookies) {
              const [name, value] = cookie.trim().split("=");
              if (name === "XSRF-TOKEN") {
                _token = decodeURIComponent(value);
                console.log(
                  "✅ Using XSRF-TOKEN as _token:",
                  _token.substring(0, 20) + "..."
                );
                return _token;
              }
            }
          }

          console.warn("⚠️ Could not fetch _token");
          return null;
        } catch (error) {
          console.error("❌ Error fetching _token:", error);
          return null;
        }
      }

      // Login function
      async function login(email, password) {
        const resultDiv = document.getElementById("result");
        const loginBtn = document.getElementById("loginBtn");

        resultDiv.style.display = "block";
        resultDiv.className = "info";
        resultDiv.innerHTML =
          "<strong>⏳ Processing...</strong><br>Getting _token from server...";
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span>Processing...';

        try {
          // Step 1: Get _token
          const token = await getToken();

          if (!token) {
            resultDiv.className = "error";
            resultDiv.innerHTML =
              "<strong>❌ Error:</strong><br>Could not obtain _token from server";
            return;
          }

          // Step 2: Send login request
          resultDiv.innerHTML =
            "<strong>⏳ Processing...</strong><br>Sending login request...";

          const loginData = {
            _token: token,
            email: email,
            password: password,
          };

          console.log("📤 Login Request:", {
            _token: token.substring(0, 20) + "...",
            email: email,
            password: "***hidden***",
          });

          const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              "X-XSRF-TOKEN": token,
            },
            credentials: "include",
            body: JSON.stringify(loginData),
          });

          const data = await response.json();
          console.log("📦 Response:", data);

          if (response.ok) {
            // Success - save auth token
            authToken = data.access_token || data.token;

            resultDiv.className = "success";
            resultDiv.innerHTML = `
                        <strong>✅ Login Berhasil!</strong><br><br>
                        <strong>User Info:</strong><br>
                        - Name: ${data.user?.name || "N/A"}<br>
                        - Email: ${data.user?.email || "N/A"}<br>
                        - Position: ${data.user?.position || "N/A"}<br><br>
                        <strong>Token:</strong><br>
                        ${
                          authToken ? authToken.substring(0, 50) + "..." : "N/A"
                        }<br><br>
                        <strong>Full Response:</strong>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;

            // Show logout section
            document.getElementById("logoutSection").style.display = "block";
            document.getElementById(
              "currentToken"
            ).textContent = `Token: ${authToken.substring(0, 30)}...`;
          } else {
            // Error
            resultDiv.className = "error";
            resultDiv.innerHTML = `
                        <strong>❌ Login Gagal!</strong><br><br>
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Message:</strong> ${
                          data.message || "Unknown error"
                        }<br><br>
                        <strong>Full Response:</strong>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
          }
        } catch (error) {
          console.error("❌ Login Error:", error);
          resultDiv.className = "error";
          resultDiv.innerHTML = `
                    <strong>❌ Network Error!</strong><br><br>
                    ${error.message}<br><br>
                    Check console untuk detail lebih lanjut.
                `;
        } finally {
          loginBtn.disabled = false;
          loginBtn.innerHTML = "Login";
        }
      }

      // Logout function
      async function logout() {
        const resultDiv = document.getElementById("logoutResult");
        const logoutBtn = document.getElementById("logoutBtn");

        resultDiv.style.display = "block";
        resultDiv.className = "info";
        resultDiv.innerHTML =
          "<strong>⏳ Processing...</strong><br>Getting _token for logout...";
        logoutBtn.disabled = true;
        logoutBtn.innerHTML = '<span class="spinner"></span>Processing...';

        try {
          // Step 1: Get fresh _token
          const token = await getToken();

          if (!token) {
            resultDiv.className = "error";
            resultDiv.innerHTML =
              "<strong>❌ Error:</strong><br>Could not obtain _token from server";
            return;
          }

          // Step 2: Send logout request
          resultDiv.innerHTML =
            "<strong>⏳ Processing...</strong><br>Sending logout request...";

          const logoutData = {
            _token: token,
          };

          console.log("📤 Logout Request:", {
            _token: token.substring(0, 20) + "...",
          });

          const response = await fetch(`${API_URL}/logout`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
              Authorization: `Bearer ${authToken}`,
              "X-XSRF-TOKEN": token,
            },
            credentials: "include",
            body: JSON.stringify(logoutData),
          });

          console.log("📦 Logout Response Status:", response.status);

          if (response.ok || response.status === 204) {
            // Success
            const data = response.status === 204 ? {} : await response.json();

            resultDiv.className = "success";
            resultDiv.innerHTML = `
                        <strong>✅ Logout Berhasil!</strong><br><br>
                        Session telah dihapus dari server.<br><br>
                        <strong>Response:</strong>
                        <pre>${
                          JSON.stringify(data, null, 2) || "No content (204)"
                        }</pre>
                    `;

            // Clear auth token and hide logout section
            authToken = null;
            setTimeout(() => {
              document.getElementById("logoutSection").style.display = "none";
              document.getElementById("result").style.display = "none";
              document.getElementById("logoutResult").style.display = "none";
            }, 3000);
          } else {
            // Error
            const data = await response.json();
            resultDiv.className = "error";
            resultDiv.innerHTML = `
                        <strong>❌ Logout Gagal!</strong><br><br>
                        <strong>Status:</strong> ${response.status}<br>
                        <strong>Message:</strong> ${
                          data.message || "Unknown error"
                        }<br><br>
                        <strong>Full Response:</strong>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
          }
        } catch (error) {
          console.error("❌ Logout Error:", error);
          resultDiv.className = "error";
          resultDiv.innerHTML = `
                    <strong>❌ Network Error!</strong><br><br>
                    ${error.message}<br><br>
                    Check console untuk detail lebih lanjut.
                `;
        } finally {
          logoutBtn.disabled = false;
          logoutBtn.innerHTML = "Logout";
        }
      }

      // Form submit handler
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          login(email, password);
        });

      // Logout button handler
      document
        .getElementById("logoutBtn")
        .addEventListener("click", function () {
          logout();
        });

      // Initial load
      console.log("🚀 Test Login & Logout Page Loaded");
      console.log("🌐 API Base URL:", API_BASE_URL);
      console.log("🔗 API URL:", API_URL);
    </script>
  </body>
</html>
